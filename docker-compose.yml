name: kazyno

services:
  postgres:
    image: postgres:16-alpine
    container_name: kazyno-postgres
    environment:
      POSTGRES_USER: kazyno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kazyno}
      POSTGRES_DB: kazyno
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kazyno -d kazyno"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - kazyno

  backend:
    build: ./backend
    container_name: kazyno-backend
    environment:
      DATABASE_URL: postgres://kazyno:${POSTGRES_PASSWORD:-kazyno}@postgres:5432/kazyno
      SESSION_SECRET: ${SESSION_SECRET:-dev-insecure-change-me}
      FT_UID: ${FT_UID:-}
      FT_SECRET: ${FT_SECRET:-}
      FT_REDIRECT_URI: ${FT_REDIRECT_URI:-http://localhost:8080/api/auth/callback}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      ADMIN_LOGINS: ${ADMIN_LOGINS:-}
      ALLOWED_CAMPUS_IDS: ${ALLOWED_CAMPUS_IDS:-62}
      TRACKER_SECRET: ${TRACKER_SECRET:-}
      FT_COALITION_UID: ${FT_COALITION_UID:-}
      FT_COALITION_SECRET: ${FT_COALITION_SECRET:-}
      TREASURE_SECRET: ${TREASURE_SECRET:-} # TEMPORAIRE — chasse au trésor
      # Paris foot — clé gratuite sur https://the-odds-api.com (500 crédits/mois)
      ODDS_API_KEY: ${ODDS_API_KEY:-}
      FOOT_LEAGUES: ${FOOT_LEAGUES:-soccer_france_ligue_one,soccer_epl,soccer_uefa_champs_league}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - kazyno

  frontend:
    build: ./frontend
    container_name: kazyno-frontend
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:4321/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - kazyno

  gateway:
    build: ./gateway
    container_name: kazyno-gateway
    environment:
      FRONTEND_URL: http://frontend:4321
      BACKEND_URL: http://backend:3000
    ports:
      # Loopback only : dev = localhost:8080, prod = Caddy (compose.prod) seul
      # point d'entrée public.
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - kazyno

volumes:
  pgdata:

networks:
  kazyno:
    driver: bridge
